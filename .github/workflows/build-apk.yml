name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installa Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepara cartella www e Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp *.mp3 www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx @capacitor/cli init "Nerdice" "com.marika.nerdice" --web-dir "www"
          npx @capacitor/cli add android
          npx @capacitor/cli sync android

      - name: Compila APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Salva e rendi scaricabile l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Nerdice-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
