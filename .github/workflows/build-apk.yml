name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepara ambiente e risorse Web
        run: |
          mkdir -p www
          cp index.html www/
          cp *.mp3 www/ 2>/dev/null || true
          
          cat << 'EOF' > package.json
          {
            "name": "nerdice",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.marika.nerdice",
            "appName": "Nerdice",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Compila APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Carica APK generato
        uses: actions/upload-artifact@v4
        with:
          name: Nerdice-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
