name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepara file e Capacitor
        run: |
          mkdir -p www
          cp -r index.html *.mp3 www/ 2>/dev/null || cp index.html www/
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init Nerdice com.marika.nerdice --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compila APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Salva e rendi scaricabile l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Nerdice-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
